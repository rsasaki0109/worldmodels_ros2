# ros_gz_bridge: sensors + odometry out, velocity commands in, ground truth out.
- {ros_topic_name: /clock, gz_topic_name: /clock, ros_type_name: rosgraph_msgs/msg/Clock, gz_type_name: gz.msgs.Clock, direction: GZ_TO_ROS}
- {ros_topic_name: /cmd_vel, gz_topic_name: /cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
- {ros_topic_name: /odom, gz_topic_name: /model/wm_robot/odometry, ros_type_name: nav_msgs/msg/Odometry, gz_type_name: gz.msgs.Odometry, direction: GZ_TO_ROS}
- {ros_topic_name: /tf, gz_topic_name: /model/wm_robot/tf, ros_type_name: tf2_msgs/msg/TFMessage, gz_type_name: gz.msgs.Pose_V, direction: GZ_TO_ROS}
- {ros_topic_name: /camera/image_raw, gz_topic_name: /camera, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /camera/camera_info, gz_topic_name: /camera_info, ros_type_name: sensor_msgs/msg/CameraInfo, gz_type_name: gz.msgs.CameraInfo, direction: GZ_TO_ROS}
- {ros_topic_name: /lidar/points, gz_topic_name: /lidar/points, ros_type_name: sensor_msgs/msg/PointCloud2, gz_type_name: gz.msgs.PointCloudPacked, direction: GZ_TO_ROS}
- {ros_topic_name: /ground_truth/poses, gz_topic_name: /world/wm_crossing/dynamic_pose/info, ros_type_name: tf2_msgs/msg/TFMessage, gz_type_name: gz.msgs.Pose_V, direction: GZ_TO_ROS}
- {ros_topic_name: /model/ped_0/cmd_vel, gz_topic_name: /model/ped_0/cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
- {ros_topic_name: /model/ped_1/cmd_vel, gz_topic_name: /model/ped_1/cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
- {ros_topic_name: /model/ped_2/cmd_vel, gz_topic_name: /model/ped_2/cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
- {ros_topic_name: /model/ped_3/cmd_vel, gz_topic_name: /model/ped_3/cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
