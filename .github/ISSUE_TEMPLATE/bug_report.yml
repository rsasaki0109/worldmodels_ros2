name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough to reproduce.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and any launch args.
      placeholder: |
        ros2 launch world_model_bringup dummy_runtime.launch.py
        ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      render: shell
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options: [dummy, ijepa, remote, other / n/a]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: ROS distro, OS, Python, GPU (if relevant)
      placeholder: "ROS 2 Jazzy, Ubuntu 24.04, Python 3.12, GPU"
    validations:
      required: true
