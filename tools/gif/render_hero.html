<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1b1b20}#c{display:block}</style></head>
<body>
<canvas id="c" width="760" height="420"></canvas>
<script>
const ctx=document.getElementById('c').getContext('2d');
const PX0=392,PX1=734,PY0=118,PY1=300;
function text(s,x,y,sz,col,al){ctx.fillStyle=col;ctx.font=`${sz}px system-ui,sans-serif`;ctx.textAlign=al||'left';ctx.fillText(s,x,y);}
function xmap(k,N){return PX0+(N<2?0:k/(N-1))*(PX1-PX0);}

window.setData=(D)=>{
  window.DATA=D;
  const vals=D.frames.flatMap(f=>[f.surprise,f.threshold]);
  window.SMAX=Math.max(0.08, Math.max(...vals)*1.15);
  window.IMGS=D.frames.map(f=>{const im=new Image();im.src=f.img;return im;});
  Promise.all(window.IMGS.map(im=>im.decode().catch(()=>{}))).then(()=>{window.imagesReady=true;});
};
function ymap(s){return PY1-Math.max(0,Math.min(1,s/window.SMAX))*(PY1-PY0);}

function renderFrame(i){
  const D=window.DATA,F=D.frames,N=F.length,fr=F[i],alarm=fr.latched;
  ctx.fillStyle='#1b1b20';ctx.fillRect(0,0,760,420);
  text('Runtime anomaly monitor — World Model',28,32,21,'#f0f0f3');
  text('watches the robot camera · flags unexpected events · self-calibrated, no failure data',28,54,13,'#9aa0ad');
  text('real LeRobot SO-101 footage · V-JEPA 2 ViT-L · adaptive threshold (mean + k·σ)',28,408,12,'#6a6a74');

  // robot camera
  const IX=28,IY=72,IS=300;
  ctx.fillStyle='#000';ctx.fillRect(IX,IY,IS,IS);
  if(window.IMGS&&window.IMGS[i])ctx.drawImage(window.IMGS[i],IX,IY,IS,IS);
  ctx.strokeStyle=fr.anomaly?'#ff5a4a':(alarm?'#ffae4d':'#33333c');ctx.lineWidth=fr.anomaly?5:1;
  ctx.strokeRect(IX-0.5,IY-0.5,IS+1,IS+1);
  text('robot camera',IX+10,IY+24,15,'#fff');

  // state banner
  if(alarm){ctx.fillStyle='#ff5a4a';text('⚠ ANOMALY DETECTED',PX0,PY0-22,20,'#ff5a4a');}
  else{text('✓ NOMINAL',PX0,PY0-22,20,'#7CFC9A');}

  // plot: surprise + adaptive threshold band
  ctx.strokeStyle='#33333c';ctx.lineWidth=1;ctx.strokeRect(PX0-0.5,PY0-0.5,PX1-PX0+1,PY1-PY0+1);
  // adaptive threshold line (per-frame)
  ctx.strokeStyle='rgba(255,170,77,0.75)';ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();
  F.forEach((f,k)=>{const x=xmap(k,N),y=ymap(f.threshold);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.setLineDash([]);
  text('adaptive threshold',PX1,ymap(F[Math.min(i,N-1)].threshold)-6,11,'rgba(255,190,120,0.9)','right');
  // surprise faint full + bright up to i
  ctx.strokeStyle='rgba(140,140,152,0.28)';ctx.lineWidth=2;ctx.beginPath();
  F.forEach((f,k)=>{const x=xmap(k,N),y=ymap(f.surprise);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  ctx.strokeStyle='#5ad1ff';ctx.lineWidth=3;ctx.beginPath();
  for(let k=0;k<=i;k++){const x=xmap(k,N),y=ymap(F[k].surprise);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  const cx=xmap(i,N),cy=ymap(fr.surprise);
  ctx.fillStyle=fr.anomaly?'#ff5a4a':'#5ad1ff';if(fr.anomaly){ctx.shadowColor='#ff5a4a';ctx.shadowBlur=14;}
  ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fill();ctx.shadowBlur=0;

  text('surprise (latent novelty)',PX0,PY1+30,13,'#9a9aa6');
  text(fr.surprise.toFixed(3),PX0,PY1+60,24,fr.anomaly?'#ff5a4a':'#5ad1ff');
  text('calibrates on nominal,',PX1,PY1+26,13,'#8b8b96','right');
  text('fires when surprise leaves the band',PX1,PY1+46,13,'#8b8b96','right');
}
window.renderFrame=renderFrame;window.__ready=true;
</script>
</body></html>
